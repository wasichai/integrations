name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# packages: read lets GITHUB_TOKEN pull the wasichai-* artifacts once each package grants this repository access
permissions:
  contents: read
  packages: read

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # organization secret: a token with read:packages. wins over GITHUB_TOKEN (settings.gradle.kts)
  WASICHAI_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

jobs:
  build:
    name: Unit tests (ktlint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # github runners have docker: testcontainers starts postgres:18. pull once so suites do not race the pull
      - name: Pull database image
        run: docker pull -q postgres:18
      - name: Integration tests
        run: ./gradlew integrationTest --no-daemon --max-workers=2
      # report artifacts are not always reachable: put the server side of a failure in the log
      - name: Server errors of the run
        if: failure()
        run: grep -rh -A30 "Unhandled error" --include="*.xml" . | head -400 || true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-reports
          path: '**/build/reports/tests/'

  publish-dry-run:
    name: Publish dry run (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Publish to a throwaway local repository
        run: ./gradlew publishToMavenLocal --no-daemon -Pversion=0.0.0-ci -Dmaven.repo.local="$RUNNER_TEMP/m2"
      - name: Release guard (Maven)
        run: .github/scripts/check-maven-publications.sh "$RUNNER_TEMP/m2"

  # the example app's image (ADR-0028): built as an operator would, then run as api + worker under compose
  image:
    name: Container image (build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the read:packages token reaches gradle inside the build as a BuildKit secret, never a build arg or a layer
      - name: Build the image
        env:
          DOCKER_BUILDKIT: '1'
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: >-
          docker build --secret id=packages_token,env=PACKAGES_TOKEN
          -f integrations-app/Dockerfile -t wasichai-integrations-app:ci .
      - name: Pull database image
        run: docker pull -q postgres:18
      - name: Smoke test (compose up, health, sign-in, catalog, compose down)
        run: .github/scripts/smoke.sh wasichai-integrations-app:ci

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: commitlint
        run: |
          npm install --no-save --no-package-lock @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
