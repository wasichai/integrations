# Llega por sync desde wasichai/wasichai-sync (files/.github/workflows/secretos.yml): se cambia allá, no aquí.
name: Secretos

# Busca credenciales en los commits nuevos, con gitleaks: reemplaza el "push protection" de GitHub, que los repos
# privados del plan gratuito no tienen. Solo mira lo que trae cada pull request o push, no el historial: lo viejo no
# bloquea nada. Un falso positivo se silencia con su fingerprint en .gitleaksignore, en la raíz del repo.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secretos en los commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # desde las releases de GitHub, con su sha256 comprobado. gitleaks-action no se usa: pide licencia en una
      # organización
      - name: Instalar gitleaks
        run: |
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          tarball="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$version/$tarball"
          echo "$sha256  $RUNNER_TEMP/$tarball" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: Buscar
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="$AFTER~1..$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          echo "commits revisados: $range"
          # --redact: el valor encontrado no aparece en el log
          "$RUNNER_TEMP/gitleaks" git . --log-opts="$range" --redact --no-banner --verbose
