# Single source of truth for every backend dependency version.
[versions]
# the wasichai libraries this repository builds on (GitHub Packages)
wasichai = "1.10.0"
kotlin = "2.4.21"
springBoot = "4.1.2"
ktlint = "14.2.0"
ktlintTool = "1.7.1"
postgresqlJdbc = "42.7.14"
flyway = "13.11.1"
testcontainers = "2.0.5"
# security floors over the spring boot bom: boot 4.1.1 ships vulnerable patch versions. drop each once boot catches up.
jackson2 = "2.22.4"
jackson3 = "3.2.4"
scram = "3.4"
# salesforce change data capture (integrations-connector-salesforce-pubsub, ADR-0024). grpc and protobuf
# runtimes come from the spring boot bom; these pin only the code generators to the same lines
protobufPlugin = "0.10.0"
protoc = "4.36.2"
grpcJava = "1.84.1"
avro = "1.12.2"
# ktlint's own classpath brings logback 1.3.15; lifted to the boot line
logback = "1.5.38"

[libraries]
wasichai-bom = { module = "wasichai:wasichai-bom", version.ref = "wasichai" }
wasichai-core = { module = "wasichai:wasichai-core" }
wasichai-test = { module = "wasichai:wasichai-test" }
wasichai-spring-boot-starter = { module = "wasichai:wasichai-spring-boot-starter" }

spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-data-r2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webflux-test = { module = "org.springframework.boot:spring-boot-starter-webflux-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
# openapi documents in yaml (integrations-connector-openapi); version from the jackson 3 bom above
jackson-dataformat-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml" }
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2" }
jackson3-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson3" }
scram-client = { module = "com.ongres.scram:scram-client", version.ref = "scram" }
scram-common = { module = "com.ongres.scram:scram-common", version.ref = "scram" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor" }
micrometer-core = { module = "io.micrometer:micrometer-core" }
micrometer-context-propagation = { module = "io.micrometer:context-propagation" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }

r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql" }
postgresql-jdbc = { module = "org.postgresql:postgresql", version.ref = "postgresqlJdbc" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }


# salesforce pub/sub api client (grpc over okhttp, protobuf messages, avro payloads); versions from the spring boot bom
grpc-okhttp = { module = "io.grpc:grpc-okhttp" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
grpc-stub = { module = "io.grpc:grpc-stub" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess" }
protobuf-java = { module = "com.google.protobuf:protobuf-java" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protoc" }
grpc-protoc-gen-java = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpcJava" }
avro = { module = "org.apache.avro:avro", version.ref = "avro" }

reactor-netty = { module = "io.projectreactor.netty:reactor-netty-http" }
reactor-test = { module = "io.projectreactor:reactor-test" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }

# build-logic: convention plugins compile against these
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
# the example app's executable jar (integrations-app, ADR-0028); same line as the boot bom
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
