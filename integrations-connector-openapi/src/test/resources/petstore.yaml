# a petstore-like api in the shape of the openapi 3 specification's own examples, with one resource per pagination style
openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
externalDocs:
  url: https://petstore.example/docs
servers:
  - url: https://petstore.example/v1
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    queryKey:
      type: apiKey
      in: query
      name: api_key
    bearer:
      type: http
      scheme: bearer
    basic:
      type: http
      scheme: basic
    oauth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://petstore.example/oauth/authorize
          tokenUrl: https://petstore.example/oauth/token
          scopes:
            read:pets: read your pets
            write:pets: modify your pets
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: string
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          title: Name
        status:
          type: string
          enum: [available, pending, sold]
        birthday:
          type: string
          format: date
        vaccinated:
          type: boolean
        weight:
          type: number
        tags:
          type: array
          items:
            type: string
            enum: [friendly, shy, loud]
        owner:
          $ref: '#/components/schemas/OwnerRef'
    Pet:
      allOf:
        - $ref: '#/components/schemas/NewPet'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
            updated_at:
              type: string
              format: date-time
              readOnly: true
    OwnerRef:
      type: object
      properties:
        id:
          type: string
    Owner:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
    OwnerPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Owner'
        meta:
          type: object
          properties:
            next_cursor:
              type: string
              nullable: true
    Toy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Visit:
      type: object
      properties:
        id:
          type: string
        pet:
          type: integer
        at:
          type: string
          format: date-time
    Species:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
  responses:
    Pet:
      description: a pet
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Pet'
paths:
  /pets:
    get:
      operationId: listPets
      summary: Pets
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/Limit'
        - name: updated_since
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          $ref: '#/components/responses/Pet'
  /pets/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      operationId: getPet
      summary: A pet
      responses:
        '200':
          $ref: '#/components/responses/Pet'
        default:
          description: error
    patch:
      operationId: updatePet
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '200':
          $ref: '#/components/responses/Pet'
    delete:
      operationId: deletePet
      responses:
        '204':
          description: deleted
  /owners:
    get:
      operationId: listOwners
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: owners
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerPage'
  /owners/{ownerId}:
    get:
      operationId: getOwner
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: an owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
  /toys:
    get:
      operationId: listToys
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: toys
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Toy'
                  next:
                    type: string
                    format: uri
  /toys/{toyId}:
    get:
      operationId: getToy
      parameters:
        - name: toyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: a toy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Toy'
  /visits:
    get:
      operationId: listVisits
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: visits, paged by the Link header
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Visit'
  /visits/{visitId}:
    get:
      operationId: getVisit
      parameters:
        - name: visitId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: a visit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
  /species:
    get:
      operationId: listSpecies
      responses:
        '200':
          description: every species in one answer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Species'
  /species/{code}:
    get:
      operationId: getSpecies
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: a species, documented without a schema
  /search:
    get:
      operationId: searchPets
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
